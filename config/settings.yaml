# =============================================================================
# config/settings.yaml — every tunable value of the project, in one place.
#
# Who reads it:
#   - Python (generators, scripts) through src/common/settings.py
#   - Terraform through yamldecode(file(...)), which passes values to Lambda (env vars)
#     and Glue (job arguments)
#
# What does NOT belong here:
#   - Master data (entities, supplier categories, suppliers, payment terms) -> config/master_data.yaml
#   - Protocol constants nobody should tune (file columns, payment types) -> src/common/schema.py
# =============================================================================

project:
  name: ap-duplicate-payment-detection
  region: us-east-1

# -----------------------------------------------------------------------------
# Reporting
# -----------------------------------------------------------------------------
reporting:
  # Every KPI is reported in USD so totals add up across entities. A fixed rate keeps the demo
  # reproducible; in production this would come from the treasury's daily rate table.
  mxn_per_usd: 18.0

# -----------------------------------------------------------------------------
# Business rules: how a duplicate payment is recognized (docs/kpi-dictionary.md)
# -----------------------------------------------------------------------------
detection:
  # HIGH confidence: the same supplier invoice (same supplier, same invoice number once normalized:
  # case, separators and leading zeros ignored) was paid more than its amount.
  overpayment_tolerance: 0.01       # in the invoice currency: anything above a cent paid in excess counts
  # MEDIUM confidence: a supplier invoices the exact same amount again under another number, dated
  # within this many days of the first one (a resubmission). Monthly fees are ~30 days apart: not caught.
  resubmission_window_days: 7

kpis:
  on_time_alert_pct: 90.0           # a supplier paid on time less often than this is highlighted

# -----------------------------------------------------------------------------
# Simulation: how the ERP behaves, and the problems planted in the data (docs/spec.md, section 3)
# -----------------------------------------------------------------------------
simulation:
  seed: 42                          # same seed -> same files -> same README numbers
  history_days: 90                  # days of payment files to produce
  warm_up_days: 45                  # invoices start this many days earlier, so day 1 already has payments due

  # New invoices received per business day, per entity (Monday-Friday)
  invoices_per_day:
    MX01: 55
    US01: 40

  # Weekdays each entity runs payments (0 = Monday ... 4 = Friday)
  payment_weekdays:
    MX01: [0, 1, 2, 3, 4]           # pays every business day
    US01: [4]                       # pays on Fridays only (spec problem 4)

  # Whether AP schedules invoices with discount terms for the discount deadline (true) or simply
  # for the due date (false). Either way it pays on the last payment-run day before the target.
  take_discounts:
    MX01: true                      # captures most 2/10 discounts
    US01: false                     # Friday-only runs, aimed at due dates: on time, but discounts lost

  # Share of eligible invoices settled with an advance first and the balance later (legitimate)
  advance_share: 0.25
  advance_pct: 0.30                 # the advance is 30% of the invoice
  advance_after_days: 2             # paid this many days after the invoice date

  # The problems planted in the data (spec section 3). Counts are over the whole history.
  incidents:
    format_duplicate:               # problem 1: the same invoice keyed twice with a different number format
      entity: MX01
      count: 12
      days_after_original: [3, 15]  # the second payment leaves this many days after the first
    resubmitted_invoice:            # problem 2: the supplier sends the same invoice again with a new number
      entity: US01
      supplier: SUP-TRANSNORTE
      count: 8
      days_after_original: [1, 5]   # the resubmitted invoice is dated a few days after the original
    advance_overpaid:               # problem 3: an advance is paid, then the full amount anyway
      count: 6                      # split between both entities
    late_supplier:                  # problem 5: one supplier always paid late
      entity: MX01
      supplier: SUP-ANDINA
      extra_days: [8, 25]           # days after the due date

# -----------------------------------------------------------------------------
# File format of the ERP export (one file per entity per day)
# -----------------------------------------------------------------------------
files:
  landing_prefix: landing/ap        # s3://<bucket>/landing/ap/entity=<ENTITY>/<ENTITY>_ap_<YYYYMMDD>.csv (as received, never changed)
  validated_prefix: validated/ap    # files that passed the checks: validated/ap/entity=<E>/dt=<YYYY-MM-DD>/<file>
  rejected_prefix: rejected/ap      # files that failed: the file plus a .reason.json next to it
  max_file_mb: 50                   # a daily AP file is a few hundred KB; anything bigger is not a normal export

# -----------------------------------------------------------------------------
# AWS sizing and timings (read by Terraform; cheap defaults, see docs/spec.md section 5)
# -----------------------------------------------------------------------------
aws:
  lambda:
    timeout_seconds: 30               # a daily file is checked in well under a second
    memory_mb: 256
    log_retention_days: 1
  glue:
    glue_version: "5.0"               # Spark 3.5 + Python 3.11 (the tests use the same PySpark)
    worker_type: G.1X
    number_of_workers: 2
    timeout_minutes: 10               # stops a runaway job (and its bill)
    schedule_cron: "cron(0 13 * * ? *)" # 13:00 UTC = 07:00 in Mexico, after the 06:00 ERP exports
    schedule_enabled: false           # off by default: a forgotten schedule keeps billing
  athena:
    bytes_scanned_cutoff_per_query: 1073741824  # 1 GB per query, then Athena cancels it
    results_expiration_days: 7
    projection_days_back: 120         # partition projection covers dt from 120 days ago (90 days of history)
